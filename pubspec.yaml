name: arac_gider_takip
description: "Araç gider takip uygulaması."
publish_to: 'none'
version: 1.2.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.1.1
  provider: ^6.1.5
  image_picker: ^1.2.3
  image: ^4.5.4
  google_mlkit_text_recognition: 0.16.0
  path_provider: ^2.1.6
  path: ^1.9.1
  image_background_remover: ^2.0.0
  googleapis: ^16.0.0
  http: ^1.6.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
